<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>调律台 · 燕云十六声装备评价工作台</title>
  <meta name="description" content="燕云十六声装备调律评价工作台：配额诊断、档位处置、转律建议、组合搜索与毕业率。">
  <!-- 部署形态（2026-11-03 重构）：纯静态站点，入口就是仓库根目录的 index.html。
       所有资源**一律用相对路径**，因此三种部署都成立：
         ① GitHub Pages 项目级站点  https://<user>.github.io/<repo>/
         ② 自定义二级域名（CNAME）  https://gear.example.com/
         ③ 本地 node tools/serve.js  http://127.0.0.1:4173/
       ⚠ 不要写 /web/... 、/data/... 这类以斜杠开头的路径——项目级 Pages 会把它解析到域名根，
         页面就白屏。改完跑 npm run check:site 自检。
       静态站没有服务端：分支模板列表走离线索引 data/template/index.json
       （新增方案后跑 npm run build:index）。 -->
  <!-- 字体全部本地化（2026-10-30）：ZeoSeven 的 FontsAPI 有防盗链，浏览器带 Referer
       请求会返回 204 空响应 → 之前全站的楷体其实一直没加载，走的是系统楷体回退。
       现在把 woff2 分片落到 assets/fonts/，离线可用、字形才是设计时选的那一套。
       楷体（文鼎PL简中楷 AR PL KaitiM GB · ARPHIC PUBLIC LICENSE）仅 400 一个字重：
       >18px 的大字可放心用合成粗体当「重按」，<18px 的小字一律降到 400/500，
       靠鎏金色与字距承重，否则笔锋会糊成一团。
       隶书（临海体）只取分支/方案横幅要用的字符分片，见 --font-li。 -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151210'/%3E%3Ctext x='32' y='45' font-size='38' text-anchor='middle' fill='%23c9a227' font-family='serif'%3E%E5%BE%8B%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="assets/fonts/kai/kai.css">
  <link rel="stylesheet" href="assets/fonts/li/li.css">
  <link rel="stylesheet" href="web/style.css?v=52">
  <link rel="stylesheet" href="web/components.css?v=63">
  <link rel="stylesheet" href="web/studio.css?v=149">
</head>
<body data-mview="assist">
  <header class="app-bar">
    <div class="app-bar-inner">
      <div class="brand">
        <span class="brand-mark">律</span>
        <div><h1>调律台</h1></div>
      </div>
      <nav class="app-nav">
        <!-- 多角色入口（用户定稿 2026-10-30）：一个玩家可能有多个账号/角色，装备不互通 -->
        <button id="app-char-btn" class="app-char-btn" title="切换/新建角色（各角色装备互不互通）">角色</button>
        <span class="muted" id="app-bar-note">载入中…</span>
      </nav>
    </div>
  </header>
  <!-- 布局（2026-11-02）：桌面宽屏三栏 = 装备 | 助手 / 右读数；窄屏两栏（助手收起）；移动端她全屏 + 底部图标栏 -->
  <main class="studio" id="app">
    <div class="st-col" id="st-leftcol">
      <div class="st-col" id="st-left"></div>
      <div class="st-col" id="st-center"><p class="muted">加载中…</p></div>
    </div>
    <div class="st-col" id="st-right"></div>
    <aside class="st-col" id="st-assist"></aside>
    <!-- 收起时的圆形入口（桌面端；移动端走底部图标栏） -->
    <button id="st-assist-toggle" title="叫她出来">线</button>
  </main>
  <!-- 移动端三视图切换（红线 / 装备 / 面板）；桌面端恒隐藏。键名仍是 assist/gear/read -->
  <nav id="st-dock" aria-label="视图切换"></nav>
  <!-- 弹窗宿主：录入装备 / 装备详情都在这里渲染（常驻详情区已取消，用户定稿） -->
  <div id="st-modal"></div>
  <!-- 启动状态条（用户定稿 2026-10-30：平时不显示——「✓ 就绪」这类加载进度是调试期产物；
       只在资源 404 / 脚本报错时自动浮出，保住排错通道） -->
  <div id="boot-status" class="muted" style="display:none; margin-top:10px"></div>
  <script>
    window.__bootStatus = function (text, cls) {
      var el = document.getElementById('boot-status');
      if (!el) return;
      if (cls !== 'err') { el.style.display = 'none'; return; }
      el.style.display = ''; el.textContent = text; el.style.color = 'var(--bad)';
    };
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && (e.target.src || e.target.href)) {
        __bootStatus('资源加载失败(404?): ' + (e.target.src || e.target.href), 'err');
      } else {
        __bootStatus('脚本错误: ' + (e.message || e.type) + (e.filename ? ' @' + e.filename + ':' + e.lineno : ''), 'err');
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      __bootStatus('异步错误: ' + String(e.reason), 'err');
    });
  </script>
  <script type="module" src="web/studio.js?v=145"></script>
</body>
</html>
