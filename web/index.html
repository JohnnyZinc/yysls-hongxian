<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>燕云装备面板验证台</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <h1>装备 → 面板 → DPS 验证台</h1>
    <div class="build-row">
      <label>流派：</label>
      <select id="build-select"></select>
      <span id="build-meta" class="muted"></span>
    </div>
  </header>
  <main id="app"><p class="muted">加载中…</p></main>
  <div id="boot-status" class="muted" style="margin-top:10px">① 页面已加载；② 脚本加载中…</div>
  <script>
    window.__bootStatus = function (text, cls) {
      var el = document.getElementById('boot-status');
      if (el) { el.textContent = text; el.style.color = cls === 'err' ? '#ff7676' : ''; }
    };
    window.addEventListener('error', function (e) {
      __bootStatus('脚本错误: ' + (e.message || e.type) + (e.filename ? ' @' + e.filename + ':' + e.lineno : ''), 'err');
    });
    window.addEventListener('unhandledrejection', function (e) {
      __bootStatus('异步错误: ' + String(e.reason), 'err');
    });
  </script>
  <script type="module" src="./app.js?v=3"></script>
</body>
</html>
