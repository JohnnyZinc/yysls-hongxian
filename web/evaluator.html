<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>燕云装备评价器</title>
  <link rel="stylesheet" href="/web/style.css">
  <link rel="stylesheet" href="/web/evaluator.css">
</head>
<body>
  <header>
    <h1>装备评价器 <a class="nav" href="/web/studio.html">→ 三栏工作台</a> <a class="nav" href="/web/index.html">→ 面板/DPS 验证台</a></h1>
    <div class="build-row">
      <label>流派：</label>
      <select id="ev-build"></select>
      <label>流：</label>
      <select id="ev-flow"></select>
      <span id="ev-meta" class="muted"></span>
    </div>
  </header>
  <main id="app"><p class="muted">加载中…</p></main>
  <div id="boot-status" class="muted" style="margin-top:10px">① 页面已加载；② 脚本加载中…</div>
  <script>
    window.__bootStatus = function (text, cls) {
      var el = document.getElementById('boot-status');
      if (el) { el.textContent = text; el.style.color = cls === 'err' ? '#ff7676' : ''; }
    };
    window.addEventListener('error', function (e) {
      if (e.target && e.target !== window && (e.target.src || e.target.href)) {
        __bootStatus('资源加载失败(404?): ' + (e.target.src || e.target.href), 'err');
      } else {
        __bootStatus('脚本错误: ' + (e.message || e.type) + (e.filename ? ' @' + e.filename + ':' + e.lineno : ''), 'err');
      }
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      __bootStatus('异步错误: ' + String(e.reason), 'err');
    });
  </script>
  <script type="module" src="/web/evaluator.js?v=1"></script>
</body>
</html>
